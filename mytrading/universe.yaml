# 계좌별 자금 비중 (%) — 현금/공격/보수/안전
# kis_devlp.yaml 의 users > 계좌 'name' 과 이름으로 연결됩니다.
# 각 계좌의 비중 합은 100 이어야 합니다 (로더가 검증).
#
# 종목 자체는 universe.yaml(공용 종목풀)에 정의하고,
# 여기서는 각 분류(공격/보수/안전)에 자금을 얼마나 배분할지만 정합니다.

users:
  Owner:
    accounts:
      일반증권1:
        cash: 30          # 현금 보유 (투자 안 함)
        aggressive: 30    # 공격 투자
        moderate: 20      # 보수 투자
        safe: 20          # 안전 투자 (ETF 등)
      # 일반증권2:
