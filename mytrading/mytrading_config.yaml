# 모드는 여기서 관리하지 않습니다 (환경변수 KIS_MODE 사용)
# 모의: 그냥 실행  /  실전: KIS_MODE=prod uv run ...

weekly_report:
  overseas:
    us: true      # 미국장 휴장 표시 (기본 off)
    japan: true   # 일본장 휴장 표시 (기본 off)
    china: true   # 중국장 휴장 표시 (기본 off) 

# ────────────────────────────────────────────────────────────
# 시장 국면 (Owner 가 직접 판단해서 설정 — 자동 판단 아님)
# 코스피·미국 지수 추세를 보고 사람이 정한다. 분할 매수 방식 결정에 사용.
#
# 값: bull(상승) / bear(하락) / sideways(횡보)
#   bull     : 지수 우상향 → 일시매수 유리 (백테스트: 상승장 일시매수 1위)
#   bear     : 지수 하락   → 분할매수 유리 (백테스트: 하락장 분할 우위)
#   sideways : 횡보·등락   → 종목 따라 다름 (개별주 일시, ETF 분할 경향)
#
# 판단 참고 지표 (사람이 볼 것 — 시스템 자동 수집 아님):
#   주  : 코스피 지수 추세 (200일 이평선 위/아래로 대세 판단)
#   미국: S&P500 / 나스닥 추세 (한국이 미국 동조화 → 함께 참고)
#   보조: 수출 증가율, 경상수지 (한국 수출 중심 — 월단위, 확인용)
#   기간: 대세 상승 최대 5년, 보통 3년 넘기 어려움 → 장기화 시 경계
#
# domestic : 국내(코스피) 종목에 적용 (삼성전자, SK하이닉스 등)
# overseas : 해외 추종 종목에 적용 (KODEX 미국S&P500 등)
market_regime:
  domestic: "bull"          # 국내 국면 (현재: 코스피 대세 상승)
  overseas: "bull"          # 해외 국면 (현재: 미국 대세 상승)
  updated: "2026-06-27"     # 마지막 갱신일
  bull_since: "2024-01"     # 현재 상승 시작 시점 (3~5년 경계 판단용)
  note: "코스피·미국 대세 상승장"
# ────────────────────────────────────────────────────────────

order_pace:
  # 스타일별 기본 동작
  accumulate:
    cadence: "weekly"      # weekly / weekly_2x(주2회)
    slice: 1               # 부족분의 1%씩 (안전자산은 천천히)
  momentum:
    cadence: "daily"
    slice: 3               # 주도주는 일단위, slice는 백테스트로 확정
  value_range:
    buy_zone: 5            # 52주 최저가 +5% 이내에서 매수
    sell_zone: 5           # 52주 최고가 -5% 이내면 매도 알림+분할매도
    slice: 2

  # 국면별 기본 배수 (base) — 강약 반영 (차영석: bear=1.3 등)
  regime_base:
    bull:     { buy: 1.0, sell: 0.0 }   # 상승장: 정상 매수, 매도 안 함
    bear:     { buy: 1.3, sell: 0.0 }   # 하락장: 기본적으로 더 적극 매수
    toppish:  { buy: 0.0, sell: 1.0 }   # 고점: 매수 중단, 분할 매도
    sideways: { buy: 1.0, sell: 0.0 }   # 횡보: 정상

  # 사용자 가중치 (0~1.0) — base에 더해짐 (스타일별)
  user_weight:
    accumulate:  { buy: 0.0, sell: 0.0 }
    momentum:    { buy: 0.5, sell: 0.0 }   # 매수만 적극, 매도는 기본(국면 따름)
    value_range: { buy: 0.0, sell: 0.0 }

  max_slice: 20            # 곱셈 결과 상한 (한 번에 최대 20%)

# 배당주 자동 추가 기준 셋팅값
dividend_filter:
  exclude_years: ["2008", "2020"]
  profit_years: 5
  rate_limit_sec: 0.5
  rate_threshold: 3.0
  debt_max: 100.0
  # 배당률 기준 = 국고채 3년물 + premium (KCIF INSIGHT에서 자동 갱신)
  #   한국 시장금리 벤치마크는 국고채 3년물 (미국·일본은 10년물).
  #   금리가 오르면 배당 요구수익률도 자동으로 올라감.
  #   ※ premium 은 보수적으로 — 너무 높이면 통과 종목이 사라짐.
  base_rate_source: kcif        # kcif(자동) | fixed(rate_threshold 사용)
  fallback_rate: 3.5            # KCIF 못 읽을 때 대비 국고채 값
  kospi:   { premium: 0.5, rate_threshold: 4.0, debt_max: 100.0, min_volume: 30000, top_n: 20 }
  kosdaq:  { premium: 1.0, rate_threshold: 4.5, debt_max: 80.0,  min_volume: 20000, top_n: 20 }

# 부채비율 관대 해석 업종 (표준산업분류 키워드)
# industry에 이 키워드가 포함되면 "부채 높아도 정상"으로 해석
# 차영석 통찰: 조선=선수금, 은행=예금, 보험=보험부채 (실제 빚 아님)
# 나중에 항공(리스)·부동산임대 등 추가하려면 여기에 한 줄씩만
# 업종별 부채 해석 규칙 (키워드 매칭 + 섹터)
# KIS industry(표준산업분류 텍스트)에 키워드 포함 시 해당 규칙 적용.
# debt: null = 부채비율 안 봄(업의 특성상), 숫자 = 부채비율 상한(%).
# ※ 값은 시작 기준값 — 차영석이 확인 후 조정 예정.
debt_industry_rules:
  "은행":  { sector: "금융",   debt: null }
  "보험":  { sector: "금융",   debt: null }
  "증권":  { sector: "금융",   debt: null }
  "여신":  { sector: "금융",   debt: null }
  "금융":  { sector: "금융",   debt: null }   # 기타 금융업
  "선박":  { sector: "산업재", debt: null }   # 조선 — 선수금=부채. 수주 많을수록 부채↑
                                             # → 부채비율로 판단 불가 (은행 예금과 같은 논리)
  "건설":  { sector: "건설",   debt: 150 }    # PF·선수금
  "항공":  { sector: "산업재", debt: 200 }    # 리스부채(IFRS16)
  "도매":  { sector: "유통",   debt: 130 }    # 리스부채
# 위 키워드 없으면 기본: { sector: "기타", debt: 100 }
debt_default: { sector: "기타", debt: 100 }

# 영업이익 평가 규칙 (재무 2순위) — 차영석 확정
# 1) 흑자 지속성: 최근 check_years 중 min_positive_years 이상 흑자
#    (위기연도 제외 — 시스템 위기는 회사 잘못 아님)
# 2) 최근 분기 영업이익증가율(YoY, 작년 동기 대비) → 등급·점수
#    ※ 점수 스케일 -2~+2 (시작값, 전체 결합 설계 후 조정 예정)
# 스타일별 재무 평가 기준 (종목 평가) — 차영석 확정
# style 은 universe.yaml 의 각 종목에 붙어 있음 (매매 방식 = 평가 기준)
#
#   value_range  (배당주)   : 안정성 중심. 배당 필수.
#   momentum     (공격적)   : 성장성 중심. 영업이익이 실제로 늘어야 함 (+10%↑).
#   accumulate   (ETF)      : 개별 기업이 아니라 재무 무의미 → 스킵.
#                             대신 경제·섹터 전망 + 차트로 판단 (별도 구현 필요).
#   free_holdings(자유투자) : 평가는 하되 강제 안 함. 알림만 주고 사람이 판단.
#                             ("자유투자니까 자유를")
style_rules:
  value_range:
    debt: required             # 업종별 부채 기준 통과 필요
    op_profit: required        # 흑자 지속성 + 위험/대악재 아님
    dividend: required         # 국고채 + 프리미엄 이상 (배당주니까 필수)
  momentum:
    debt: required
    op_profit: required
    op_min_growth: 10          # ★ 영업이익증가율 +10% 이상 (성장 확인)
    dividend: skip             # 성장주는 배당 안 봄
  accumulate:
    skip_financial: true       # ETF — 재무 평가 자체를 안 함
  free_holdings:
    advisory: true             # 평가하되 통과/탈락 강제 안 함 (사람 판단)

op_profit_rules:
  check_years: 5
  min_positive_years: 3
  exclude_years: ["2008", "2020"]      # 리먼·코로나
  # 등급 판정 (위에서부터, min 이상이면 해당 등급)
  grades:
    - { min: 50,   label: "대호재" }
    - { min: 25,   label: "호재" }
    - { min: 10,   label: "좋음",  score: 1 }    # 고정점수
    - { min: -10,  label: "보통",  score: 0 }    # 고정점수
    - { min: -25,  label: "경고",  score: -1 }   # 고정점수
    - { min: -50,  label: "위험" }
    - { min: null, label: "대악재" }
  # 점수 규칙: |증가율| >= step 이면 계단식 (부호 x (1 + |증가율|//step))
  #            그 미만이면 위 grades 의 고정 score.
  #  예: +25%→+2, +50%→+3, +756%→+31 / -25%→-2, -50%→-3
  score_step: 25          # 25%마다 +1
  # 알림 임계 (텔레그램) — |증가율| 이 이 값 이상이면 알림 (크론 연결 시 사용)
  notify_threshold: 25

trading:
  symbols: ["005930"]      # 대상 종목 (삼성전자)
  default_qty: 1           # 기본 주문 수량

backtest:
  start_date: "2023-01-01"
  end_date: "today"        # "today" = 오늘 날짜 자동. 고정하려면 "2024-12-31" 식으로.

# 데이터 prefetch 설정
data:
  prefetch_start: "2020-01-01"   # 미리 받아둘 시작일 (이 이후를 캐시에 채움)

logging:
  level: "INFO"
  results_dir: "mytrading/results"

# 레이트리밋 대응 — 조회 호출 간격(초)
# 모의(vps)는 초당 호출 제한이 낮아 간격을 크게. EGW00201 계속 나면 vps_sleep 키우기.
rate_limit:
  vps_sleep: 1.0
  prod_sleep: 0.1

storage:
  reports_dir: "mytrading/reports"    # 보고서 저장 (용량 큼)
  # 디스크 추가 시 여기만 수정:
  # reports_dir: "/mnt/disk2/reports"
  
# ────────────────────────────────────────────────────────────
# 뉴스레터 구독 만료 감시 (newsletter_check.py, 크론: 매월 초 주말)
# Gmail 라벨의 메일 제목·본문에서 키워드가 감지되면 텔레그램 알림.
#
# 목적: 한국은행 등 뉴스레터는 일정 기간(추정 2년) 후 재신청 안 하면 중단됨.
#       중단 예고 메일을 놓치지 않도록 감시.
# ※ keywords 는 예제. 실제 중단 메일 문구를 확인하면 정확히 교체할 것.
# ※ 라벨 추가는 targets 에 항목만 늘리면 됨 (여러 뉴스레터 확장 가능).
newsletter_watch:
  keywords:            # 이 중 하나라도 제목/본문에 있으면 알림 (예제)
    - 중단
    - 만료
    - 재신청
    - 갱신
    - 종료
    # 제거됨(상용구 오탐): 해지, 수신 거부, 구독 취소
    #   → 뉴스레터 하단 수신거부 안내에 항상 있어 오탐 유발
    #   실제 중단 메일 문구 확인 후 필요한 것만 추가할 것
  targets:             # 감시할 Gmail 라벨 목록
    - label: 경제/한국은행
      name: 한국은행 뉴스레터
    - label: 경제/국제금융
      name: 국제금융센터(KCIF)
    # 나중에 확장 예시 (주석 해제하고 추가):
    # - label: 경제/자본시장연구원
    #   name: 자본시장연구원
# ────────────────────────────────────────────────────────────
# KCIF 리스크워치 미수신 감시 (newsletter_check.py, 마지막 주 일요일)
# 월간 리스크워치 메일이 이번 달에 안 왔으면 → PDF 받으라고 텔레그램 알림.
# 뉴스레터 본문 총평으로 확인하는 게 1차, 미수신 시 PDF가 2차 백업.
kcif_watch:
  label: 경제/국제금융       # 확인할 라벨
  subject_keyword: 리스크 워치  # 이 키워드 + 이번달 태그(예 '26.7월)로 판단
  message: "이번 달 KCIF 글로벌 리스크 워치 뉴스레터가 아직 없어요. PDF를 받아서 처리하세요."
# ────────────────────────────────────────────────────────────
# 한국투자증권 서버점검 공지 감시 (newsletter_check.py, 일요일 11시)
# 점검 안내 메일의 이미지를 OCR 하여 점검 일시를 추출 → 텔레그램 알림.
# 점검 시간엔 KIS API 가 막히므로 봇 운영 주의 안내.
# ※ 이미 알린 공지는 ~/KIS/cache/kis_maint_seen.json 에 기록해 중복 방지.
kis_maintenance_watch:
  label: 경제/한국투자증권       # 확인할 라벨
  subject_keyword: 중단 안내      # 점검 공지 제목 키워드
  img_host: securities.koreainvestment.com  # 점검 이미지가 오는 호스트
