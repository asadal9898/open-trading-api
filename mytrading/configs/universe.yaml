# 공용 종목풀 — 모든 계좌가 참조하는 종목 분류 리스트
# 계좌는 비중(allocations.yaml)만 다르고, 종목은 이 풀에서 공통으로 사용합니다.
#
# 분류 (공용 — 모두가 같은 종목):
#   aggressive (공격) : 개별주, 변동성 큰 종목 (기술주, 바이오)
#   moderate   (보수) : 안정적 개별주 (떨어진 우량 배당주 등)
#   safe       (안전) : 지수 ETF(S&P500/나스닥100), 채권 ETF 등 분산 자산
#
# ※ 자유 투자(free)는 사람마다 다르므로 여기(공용)가 아니라
#    allocations.yaml 의 각 계좌 free_symbols 에 개인별로 둡니다.
#
# 형식: { code: "종목코드6자리", name: "표시이름" }
# ※ 자동매매에 쓰려면 각 종목/전략을 반드시 백테스트로 검증한 뒤 추가하세요.
# style momentum, growth  
#growth (성장주)   — 영업이익 성장이 핵심. 실적이 실제로 늘어야.
#                    재무: 부채 + 영업이익 +10%↑ (엄격)
#                    차트: 정배열

# momentum (공격적) — 추세가 핵심. 차트 위주.
#                     재무: 부채 + 영업이익(위험만 아니면)  ← 느슨
#                     차트: 정배열


