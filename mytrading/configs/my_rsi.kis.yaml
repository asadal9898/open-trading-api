version: "1.0"
metadata:
  name: "RSI 과매도 반등"
  description: "RSI가 과매도(기본 30) 아래면 매수, 과매수(기본 70) 위면 매도하는 평균회귀 전략"
  author: "asadal9898"
  tags:
    - rsi
    - mean_reversion
    - oversold
    - overbought
strategy:
  id: my_rsi
  category: mean_reversion
  params:
    rsi_period:
      default: 14
      min: 2
      max: 50
      type: int
      description: "RSI 계산 기간"
    oversold:
      default: 30
      min: 10
      max: 40
      type: float
      description: "과매도 기준 (이 값 미만이면 매수)"
    overbought:
      default: 70
      min: 60
      max: 90
      type: float
      description: "과매수 기준 (이 값 초과면 매도)"
    stop_loss_pct:
      default: 5.0
      min: 2
      max: 15
      type: float
      description: "손절 %"
  indicators:
    - id: rsi
      alias: rsi
      params:
        period: $rsi_period
  entry:
    logic: AND
    conditions:
      - indicator: rsi
        operator: less_than
        value: $oversold
  exit:
    logic: OR
    conditions:
      - indicator: rsi
        operator: greater_than
        value: $overbought
risk:
  stop_loss:
    enabled: true
    percent: 5.0
  take_profit:
    enabled: false
  trailing_stop:
    enabled: false